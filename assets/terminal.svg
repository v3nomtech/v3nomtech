<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace" font-size="14">
  <style>
    .line { opacity: 0; animation: show 0.01s forwards; }
    .p  { fill: #00ff9c; }
    .u  { fill: #3b82f6; font-weight: bold; }
    .t  { fill: #e6edf3; }
    .d  { fill: #8b949e; }
    .ok { fill: #00ff9c; }
    .w  { fill: #f0b429; }
    .r  { fill: #ff5f56; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    .cursor { animation: blink 1s step-end infinite; }
  </style>

  <!-- window -->
  <rect width="820" height="380" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect width="820" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="820" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="410" y="22" text-anchor="middle" class="d" font-size="12">v3nom@kali: ~</text>

  <!-- session -->
  <g transform="translate(20,62)">
    <text class="line" style="animation-delay:0.3s"><tspan class="p">┌──(</tspan><tspan class="u">v3nom㉿kali</tspan><tspan class="p">)-[</tspan><tspan class="t">~</tspan><tspan class="p">]</tspan></text>
    <text y="22" class="line" style="animation-delay:0.6s"><tspan class="p">└─$ </tspan><tspan class="t">whoami</tspan></text>
