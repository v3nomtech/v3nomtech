    <text y="98" class="line" style="animation-delay:2.6s"><tspan class="ok">[✔] </tspan><tspan class="t">CPTS · CJCA · SC-200 · eJPT</tspan><tspan class="d">   // + HTB Pro Labs: Dante, RastaLabs</tspan></text>

    <text y="130" class="line" style="animation-delay:3.4s"><tspan class="p">└─$ </tspan><tspan class="t">./hunt --mitre --telemetry edr,siem,netflow</tspan></text>
    <text y="152" class="line" style="animation-delay:4.0s"><tspan class="w">[*] </tspan><tspan class="t">loading hypotheses ............................. </tspan><tspan class="ok">done</tspan></text>
    <text y="174" class="line" style="animation-delay:4.6s"><tspan class="w">[*] </tspan><tspan class="t">correlating IOCs against CTI feeds ............. </tspan><tspan class="ok">done</tspan></text>
    <text y="196" class="line" style="animation-delay:5.2s"><tspan class="r">[!] </tspan><tspan class="t">T1055 Process Injection  →  </tspan><tspan class="r">beacon detected</tspan></text>
    <text y="218" class="line" style="animation-delay:5.8s"><tspan class="w">[*] </tspan><tspan class="t">dumping sample → ghidra ........................ </tspan><tspan class="ok">reversed</tspan></text>
    <text y="240" class="line" style="animation-delay:6.4s"><tspan class="ok">[+] </tspan><tspan class="t">yara + sigma rules shipped · C2 blocked · actor profiled</tspan></text>

    <text y="272" class="line" style="animation-delay:7.2s"><tspan class="p">└─$ </tspan><tspan class="t">echo $MOTTO</tspan></text>
    <text y="294" class="line" style="animation-delay:7.8s"><tspan class="p">Think like the adversary. Hunt like the defender.</tspan></text>

    <text y="316" class="line" style="animation-delay:8.4s"><tspan class="p">└─$ </tspan><tspan class="p cursor">█</tspan></text>
