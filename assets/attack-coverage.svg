      <text x="6" y="44" class="tech">T1021 Remote Svc</text><text x="6" y="60" class="tech">T1550 Pass-the-X</text><text x="6" y="76" class="tech">T1570 Tool Xfer</text></g>
    <g transform="translate(232,110)"><rect width="108" height="26" rx="4" fill="#0e5c3a"/><text x="54" y="17" text-anchor="middle" class="tacL">COLLECTION</text>
