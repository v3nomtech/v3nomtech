    <g transform="translate(348,110)"><rect width="108" height="26" rx="4" fill="#00ff9c"/><text x="54" y="17" text-anchor="middle" class="tac">C2</text>
      <text x="6" y="44" class="tech">T1071 App Proto</text><text x="6" y="60" class="tech">T1573 Encrypted</text><text x="6" y="76" class="tech">T1105 Ingress</text></g>
    <g transform="translate(464,110)"><rect width="108" height="26" rx="4" fill="#00b86f"/><text x="54" y="17" text-anchor="middle" class="tac">EXFILTRATION</text>
      <text x="6" y="44" class="tech">T1041 Over C2</text><text x="6" y="60" class="tech">T1567 Web Svc</text></g>
    <g transform="translate(580,110)"><rect width="108" height="26" rx="4" fill="#00b86f"/><text x="54" y="17" text-anchor="middle" class="tac">IMPACT</text>
      <text x="6" y="44" class="tech">T1486 Ransomware</text><text x="6" y="60" class="tech">T1490 Inhibit Rec</text></g>
    <g transform="translate(696,110)"><rect width="104" height="26" rx="4" fill="#0e5c3a"/><text x="52" y="17" text-anchor="middle" class="tacL">RESOURCE DEV</text>
      <text x="6" y="44" class="tech">T1583 Infra</text><text x="6" y="60" class="tech">T1588 Capabilities</text></g>
  </g>

  <!-- legend -->
  <g transform="translate(20,300)">
    <rect width="12" height="12" rx="2" fill="#00ff9c"/><text x="18" y="10" class="leg">High</text>
    <rect x="70" width="12" height="12" rx="2" fill="#00b86f"/><text x="88" y="10" class="leg">Medium</text>
    <rect x="156" width="12" height="12" rx="2" fill="#0e5c3a"/><text x="174" y="10" class="leg">Low</text>
    <text x="800" y="10" text-anchor="end" class="leg">Techniques actively hunted / covered by detections</text>
