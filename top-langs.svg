  .m { font: 400 12px 'Segoe UI',Ubuntu,'Helvetica Neue',Sans-Serif; fill: #8b949e; }
  .fade { opacity: 0; animation: in .5s ease-out forwards; }
  @keyframes in { to { opacity: 1; } }
</style>
